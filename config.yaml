server:
  # 0.0.0.0 so this works both natively (still reachable via localhost) and
  # inside a container (127.0.0.1 there only accepts connections from
  # within the container's own network namespace, which Docker's port
  # mapping and PaaS load balancers can't reach).
  host: 0.0.0.0
  port: 8080
  timeout: 30

app:
  data_file: data/servers.csv
  upload_dir: data/uploads
  # Deliberately not set here - this file is committed to source control,
  # so a real credential doesn't belong in it. Set the ADMIN_TOKEN
  # environment variable instead (see applyEnvOverrides in internal/config)
  # to gate POST /v1/admin/upload; for local development, either export
  # ADMIN_TOKEN or set admin_token below (untracked, uncommitted changes
  # to this file only).
  # admin_token: your-local-dev-token
  logging:
    level: info
